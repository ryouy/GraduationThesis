name: One-time monthly experiment migration
on:
  push:
    branches:
      - chore/group-experiments-by-month-20261115
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite paths, validate links, preserve data, and commit
        shell: bash
        run: |
          python3 - <<'PY'
          import ast
          import json
          import os
          import posixpath
          import re
          import subprocess
          from pathlib import Path

          BASE = 'b304ba9ebac3aab85c7d64dc4773a9bf2592a3ea'
          files = subprocess.check_output(['git', 'ls-tree', '-r', '-z', '--name-only', BASE]).decode('utf-8').strip('\x00').split('\x00')
          roots = sorted({p.split('/')[0] for p in files if re.match(r'^(10|11)\d\d(?:_|/)', p)}, key=len, reverse=True)
          root_re = '|'.join(map(re.escape, roots))
          prefix = re.compile(r'(?<![\w-])(?<!experiments/2026-10/)(?<!experiments/2026-11/)(' + root_re + r')(?=/)')
          exact = re.compile(r'(?<=["\x27])(' + root_re + r')(?=["\x27])')
          moved = lambda p: 'experiments/' + ('2026-10/' if p.startswith('10') else '2026-11/') + p if p.split('/')[0] in roots else p
          all_new = {moved(p) for p in files}
          changed = []
          broken = []
          py_errors = []

          def rewrite_inline(s):
              s = prefix.sub(lambda m: 'experiments/' + ('2026-10/' if m.group(1).startswith('10') else '2026-11/') + m.group(1), s)
              s = exact.sub(lambda m: 'experiments/' + ('2026-10/' if m.group(1).startswith('10') else '2026-11/') + m.group(1), s)
              return s

          def rewrite_md(s, old_path, new_path):
              old_dir, new_dir = posixpath.dirname(old_path), posixpath.dirname(new_path)
              def link(m):
                  url = m.group(1)
                  if url.startswith(('http:', 'https:')):
                      return '](' + rewrite_inline(url) + ')'
                  if url.startswith(('#', '/', 'mailto:', 'data:')):
                      return m.group(0)
                  urlpath, fragment = (url.split('#', 1) + [''])[:2]
                  if not urlpath or any(x in urlpath for x in [' ', '<', '>']):
                      return m.group(0)
                  old_target = posixpath.normpath(posixpath.join(old_dir, urlpath))
                  new_target = moved(old_target)
                  new_url = posixpath.relpath(new_target, new_dir or '.')
                  if urlpath.endswith('/'):
                      new_url += '/'
                  if fragment:
                      new_url += '#' + fragment
                  if old_target in files or old_target in old_dirs:
                      resolved = posixpath.normpath(posixpath.join(new_dir, new_url.split('#')[0]))
                      if resolved not in all_new and not any(q.startswith(resolved + '/') for q in all_new):
                          broken.append((new_path, url, new_url))
                  return '](' + new_url + ')'
              pieces = re.split(r'(\]\([^)\n]+\))', s)
              for i, part in enumerate(pieces):
                  if part.startswith('](') and part.endswith(')'):
                      pieces[i] = re.sub(r'\]\(([^)\n]+)\)', link, part)
                  else:
                      pieces[i] = rewrite_inline(part)
              return ''.join(pieces)

          old_dirs = set()
          for p in files:
              parts = p.split('/')
              for i in range(1, len(parts)):
                  old_dirs.add('/'.join(parts[:i]))

          for old_path in files:
              new_path = moved(old_path)
              if not new_path.endswith(('.md', '.py', '.ipynb')):
                  continue
              raw = subprocess.check_output(['git', 'show', BASE + ':' + old_path])
              try:
                  original = raw.decode('utf-8')
              except UnicodeDecodeError:
                  py_errors.append((new_path, 'Non-UTF-8 source'))
                  continue
              if new_path.endswith('.ipynb'):
                  nb = json.loads(original)
                  for cell in nb.get('cells', []):
                      if cell.get('cell_type') not in ('code', 'markdown'):
                          continue
                      src = cell.get('source', [])
                      was_list = isinstance(src, list)
                      value = ''.join(src) if was_list else src
                      value = rewrite_md(value, old_path, new_path) if cell['cell_type'] == 'markdown' else rewrite_inline(value)
                      cell['source'] = value.splitlines(keepends=True) if was_list else value
                  result = json.dumps(nb, ensure_ascii=False, indent=1) + '\n'
              elif new_path.endswith('.md'):
                  result = rewrite_md(original, old_path, new_path)
              else:
                  result = rewrite_inline(original)
                  # Top-level experiment scripts formerly used parents[1] for the repo root.
                  if old_path.split('/')[0] in roots and old_path.count('/') == 1:
                      result = re.sub(r'(\b(?:ROOT|REPO_ROOT|REPOSITORY_ROOT)\s*=\s*Path\(__file__\)\.resolve\(\)\.parents\[)1(\])', r'\g<1>3\2', result)
                  try:
                      ast.parse(result)
                  except SyntaxError as exc:
                      py_errors.append((new_path, str(exc)))
              if old_path == 'README.md':
                  result = result.replace('実行コードやデータの参照パスを壊さないよう、実験ディレクトリ本体は現時点で移動していません。', '日付別の実験ディレクトリは experiments/2026-10/ と experiments/2026-11/ に移動しました。')
                  begin = result.find('├── experiments/README.md')
                  end = result.find('├── Interim_Posters/', begin)
                  if begin != -1 and end != -1:
                      result = result[:begin] + '├── experiments/\n│   ├── README.md\n│   ├── 2026-10/               # 10月の実験\n│   └── 2026-11/               # 11月の実験\n' + result[end:]
              if old_path == 'experiments/README.md':
                  result = result.replace('**既存の実験データを安全に保持するため、現在は元のディレクトリへのリンクです。**', '**実験データを変更せず、月別フォルダに整理しました。**')
                  result = re.sub(r'\*\*注意：\*\* 実験の再現に使うColabのURL、相対パス、出力ファイル参照は旧パスを前提にしている場合があります。実体の移動は、参照先を網羅的に更新できる段階でまとめて実施します。', '過去の実行ログは記録当時のパスを保持しています。', result)
              path = Path(new_path)
              if not path.is_file():
                  py_errors.append((new_path, 'missing moved file'))
                  continue
              if result != path.read_text(encoding='utf-8'):
                  path.write_text(result, encoding='utf-8')
                  changed.append(new_path)

          # Ensure all original non-source blobs have been preserved without modification.
          original_blobs = subprocess.check_output(['git', 'ls-tree', '-r', '-z', BASE]).decode('utf-8').strip('\x00').split('\x00')
          for line in original_blobs:
              info, path = line.split('\t', 1)
              old_sha = info.split()[2]
              if path.endswith(('.md', '.py', '.ipynb')):
                  continue
              current_sha = subprocess.check_output(['git', 'hash-object', moved(path)], text=True).strip()
              if current_sha != old_sha:
                  py_errors.append((moved(path), 'Non-source blob changed'))

          if broken or py_errors:
              print('BROKEN LINKS:', json.dumps(broken[:100], ensure_ascii=False))
              print('ERRORS:', json.dumps(py_errors[:100], ensure_ascii=False))
              raise SystemExit(1)
          print('Updated source files:', len(changed))
          print('Moved experiment folders:', len(roots))
          print('All non-source blobs unchanged and source syntax/link checks passed')
          PY
          rm .github/workflows/one-time-monthly-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: rebase experiment documentation and executable paths; validate original data"
            git push origin HEAD:chore/group-experiments-by-month-20261115
          fi
