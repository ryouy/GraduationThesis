name: Research website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Materialize approved protocol illustration (one time)
        if: github.ref == 'refs/heads/main'
        run: |
          test ! -f docs/figures/protocol_v095_vertical_flow.png || exit 0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python3 -m venv /tmp/protocol-figure-venv
          /tmp/protocol-figure-venv/bin/pip install Pillow
          /tmp/protocol-figure-venv/bin/python docs/figures/generate_protocol_v095_vertical_flow.py
          test -s docs/figures/protocol_v095_vertical_flow.png
          # Restore normal read-only Pages workflow in the same commit.
          git show HEAD^:.github/workflows/pages.yml > .github/workflows/pages.yml
          git add docs/figures/protocol_v095_vertical_flow.png .github/workflows/pages.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Store protocol v0.95 flow diagram and restore standard Pages workflow"
          git push origin HEAD:main
      - run: python3 website/build.py
      - run: python3 website/smoke_test.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
